<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trail des Zikos</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0d0d0d;
            color: white;
            text-align: center;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            background:
                linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.75)),
                linear-gradient(135deg, #171717, #4b0000);
        }

        .logo {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .edition {
            font-size: 22px;
            color: #e63939;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .date {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .location {
            font-size: 18px;
            color: #cccccc;
            margin-bottom: 45px;
        }

        .button {
            display: inline-block;
            background: #d71920;
            color: white;
            text-decoration: none;
            padding: 16px 38px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .button:hover {
            background: #f02a32;
        }

        .intro {
            margin-top: 35px;
            max-width: 500px;
            line-height: 1.6;
            color: #dddddd;
        }
    </style>
</head>

<body>

    <section class="hero">

        <div class="logo">
            Trail des Zikos
        </div>

        <div class="edition">
            PREMIÈRE ÉDITION
        </div>

        <div class="date">
            11 AVRIL 2027
        </div>

        <div class="location">
            Airaines — Dreuil-Hamel
        </div>

        <a href="#" class="button">
            S'inscrire
        </a>

        <p class="intro">
            Deux parcours, une ambiance musicale et un village
            pour partager une belle journée autour du trail.
        </p>

    </section>

</body>
</html>
